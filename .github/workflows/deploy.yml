name: Deploy to EC2

on:
  push:
    branches:
      - pprod
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd /home/ubuntu/your-project-folder
            git pull origin ${{ github.ref_name }}
            npm install
            npm run build
            pm2 restart all
